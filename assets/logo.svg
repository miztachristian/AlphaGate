<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="AlphaGate logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="#070b12"/>
  <circle cx="100" cy="94" r="80" fill="url(#glow)"/>

  <!-- shield -->
  <path d="M100 26 L164 54 V106 C164 144 135 170 100 181 C65 170 36 144 36 106 V54 Z"
        fill="#0b1220" stroke="url(#g)" stroke-width="7" stroke-linejoin="round"/>

  <!-- gate pillars + threshold -->
  <rect x="66" y="66" width="16" height="44" rx="5" fill="url(#g)"/>
  <rect x="118" y="66" width="16" height="44" rx="5" fill="url(#g)"/>
  <rect x="66" y="118" width="68" height="13" rx="6" fill="#0ea5e9" opacity="0.5"/>

  <!-- pass check -->
  <path d="M84 146 L96 158 L120 130" fill="none" stroke="#34d399" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
